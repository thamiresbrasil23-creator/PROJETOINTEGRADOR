<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respostas enviadas</title>
<style>
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    font-family:Arial,Helvetica,sans-serif;background:#F5F8FC;color:#1E293B;padding:24px
  }
  .card{
    max-width:620px;background:#fff;border:1px solid #DCE5EF;border-radius:22px;
    padding:42px;text-align:center;box-shadow:0 18px 50px rgba(15,23,42,.08)
  }
  .icon{
    width:62px;height:62px;margin:0 auto 18px;border-radius:50%;
    display:grid;place-items:center;background:#EAF8F4;color:#0F6B58;font-size:30px;font-weight:700
  }
  h1{margin:0 0 12px;font-size:30px;color:#0A4D8C}
  p{margin:0;color:#64748B;line-height:1.65}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Respostas enviadas!</h1>
    <p>Muito obrigada pela colaboração. As informações serão utilizadas como apoio ao Projeto Integrador acadêmico.</p>
  </div>
</body>
</html>
